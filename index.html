<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    
</head>
<body>
    <main>
        <section id="login">
    <div id="imagem">
        <!-- Imagem de fundo via CSS -->
    </div>

    <!-- O FORM FICA DENTRO DA DIV FORMULARIO -->
    <div id="formulario">
        <h1>Login</h1>
        <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
        
        <form action="login.php" method="post" autocomplete="on">
            <div class="campo">
                <i class="material-symbols-outlined">person</i>
                <input type="email" name="login" id="ilogin" placeholder="Seu E-mail" autocomplete="email" required maxlength="30">
                <label for="ilogin">Login</label>
            </div>
            <div class="campo">
                <i class="material-symbols-outlined">vpn_key</i>
                <input type="password" name="senha" id="isenha" placeholder="Sua Senha" autocomplete="current-password" required minlength="8" maxlength="20">
                <label for="isenha">Senha</label>
            </div>
            <input type="submit" value="Entrar">
            <a href="#" class="botao">Esqueci a senha <i class="material-symbols-outlined">mail</i></a> 
        </form>
    </div> <!-- Fechamento da div#formulario AQUI -->
</section>
    </main>
    
</body>
</html>
